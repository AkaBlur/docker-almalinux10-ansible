---

name: Docker CI

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t docker-ansible .

      - name: Save image
        run: docker save docker-ansible | gzip > image.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz

  test:
    name: Test image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < image.tar.gz
      
      - name: Build test container
        run: >-
          docker run --name test -d --rm --privileged
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host
          docker-ansible

      - name: Verify LANG environment
        run: >-
          docker exec test
          bash -c '[ $LANG = "en_US.UTF-8" ]'
        
      - name: Verify locale.conf
        run: >-
          docker exec test
          bash -c 'grep -qx "LANG=en_US.UTF-8" /etc/locale.conf'
      
      - name: Verify UTF-8 locale exists
        run: >-
          docker exec test
          bash -c 'locale -a | grep -qi "en_US"'

      - name: Verify active locale
        run: >-
          docker exec test
          bash -c 'locale | grep -qi "LANG=en_US.UTF-8"'

      - name: Verify systemd is running as process root
        run: >-
          docker exec test
          bash -c 'ps -p 1 -o comm= | grep -qx systemd'

      - name: Verify permissions for shadow file
        run: >-
          docker exec test
          bash -c '[ "$(stat -c %a /etc/shadow)" = "400" ]'

      - name: Verify ansible user exists
        run: >-
          docker exec test
          bash -c 'id ansible > /dev/null 2>&1'

      - name: Verify password-less login for ansible user
        run: >-
          docker exec test
          bash -c 'su - ansible -c "sudo true"'
  
  release:
    name: Release image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < image.tar.gz

      - name: Extract repo name
        id: image_name
        run: >-
          _REPO=${GITHUB_REPOSITORY//[0-9\.]/};
          echo "image_name=${_REPO#*-}" >> $GITHUB_OUTPUT
      
      - name: Extract repo tag
        id: image_tag
        run: >-
          [[ $GITHUB_REPOSITORY =~ [0-9.]+ ]] &&
          echo "image_tag=${BASH_REMATCH[0]}" >> $GITHUB_OUTPUT

      - name: Tag Docker image
        run: >
          docker image tag docker-ansible
          ${{ steps.image_name.outputs.image_name }}:${{ steps.image_tag.outputs.image_tag }}

      - name: Build and push image
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: quay.io/${{ secrets.REPO_USER }}
          image: ${{ steps.image_name.outputs.image_name }}
          tags: ${{ steps.image_tag.outputs.image_tag }}
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.REPO_PW }}
